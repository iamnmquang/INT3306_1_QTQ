services:
  mysql:
    image: mysql:8.0
    container_name: qtq_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: qtqairplane
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123456
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
