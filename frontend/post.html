<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bài viết | QTQ Airline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease forwards; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">

    <header class="flex justify-between items-center mb-6 bg-gray-800 p-4 rounded-lg shadow-lg border border-gray-700">
        <div class="flex items-center gap-4">
            <a href="#" class="text-cyan-400 hover:text-cyan-300 transition no-underline">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="text-2xl font-bold text-cyan-400">📰 Quản lý Nội dung (CMS)</div>
        </div>
        <button onclick="openPostModal('add')" class="bg-cyan-600 hover:bg-cyan-700 px-4 py-2 rounded-lg text-sm font-bold transition">
            <i class="fas fa-plus mr-2"></i> Viết bài mới
        </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex items-center gap-4">
            <div class="bg-cyan-500/20 p-3 rounded-full text-cyan-400"><i class="fas fa-file-alt fa-lg"></i></div>
            <div>
                <p class="text-gray-400 text-xs uppercase font-bold">Tổng bài viết</p>
                <p class="text-xl font-bold" id="total-post-count">0</p>
            </div>
        </div>
        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex items-center gap-4">
            <div class="bg-green-500/20 p-3 rounded-full text-green-400"><i class="fas fa-check-circle fa-lg"></i></div>
            <div>
                <p class="text-gray-400 text-xs uppercase font-bold">Đã xuất bản</p>
                <p class="text-xl font-bold" id="published-post-count">0</p>
            </div>
        </div>
        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex items-center gap-4">
            <div class="bg-yellow-500/20 p-3 rounded-full text-yellow-400"><i class="fas fa-clock fa-lg"></i></div>
            <div>
                <p class="text-gray-400 text-xs uppercase font-bold">Bản nháp</p>
                <p class="text-xl font-bold" id="draft-post-count">0</p>
            </div>
        </div>
    </div>

    <div class="bg-gray-800 rounded-lg shadow-lg border border-gray-700 p-5">
        <div class="flex flex-col md:flex-row justify-between mb-6 gap-4">
            <div class="flex gap-2 w-full md:w-auto">
                <input type="text" id="post-search" placeholder="Tìm tiêu đề bài viết..." 
                    class="bg-gray-700 border border-gray-600 rounded-md px-4 py-2 text-sm w-full md:w-80 focus:ring-2 focus:ring-cyan-500 outline-none">
                <select id="filter-category" class="bg-gray-700 border border-gray-600 rounded-md px-3 py-2 text-sm outline-none">
                    <option value="">Tất cả danh mục</option>
                    <option value="Tin tức">Tin tức</option>
                    <option value="Khuyến mãi">Khuyến mãi</option>
                    <option value="Cẩm nang">Cẩm nang</option>
                </select>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-gray-400 uppercase bg-gray-700/50">
                    <tr>
                        <th class="px-6 py-4">Bài viết</th>
                        <th class="px-6 py-4">Danh mục</th>
                        <th class="px-6 py-4">Ngày đăng</th>
                        <th class="px-6 py-4">Trạng thái</th>
                        <th class="px-6 py-4 text-right">Thao tác</th>
                    </tr>
                </thead>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="postModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-4xl rounded-xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <h3 id="modalPostTitle" class="text-lg font-bold text-cyan-400">Soạn thảo nội dung</h3>
                <button onclick="closePostModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
            </div>
            
            <form id="postForm" class="p-6 overflow-y-auto space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Tiêu đề bài viết</label>
                            <input type="text" id="modal-title" placeholder="Nhập tiêu đề hấp dẫn..." required 
                                class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:border-cyan-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Nội dung chi tiết</label>
                            <textarea id="modal-content" rows="8" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:border-cyan-500 outline-none" placeholder="Viết nội dung tại đây..."></textarea>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Danh mục</label>
                            <select id="modal-category" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white outline-none">
                                <option value="Tin tức">Tin tức</option>
                                <option value="Khuyến mãi">Khuyến mãi</option>
                                <option value="Cẩm nang">Cẩm nang du lịch</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Ảnh đại diện</label>
                            <div class="border-2 border-dashed border-gray-600 rounded-lg p-4 text-center hover:border-cyan-500 transition cursor-pointer">
                                <i class="fas fa-cloud-upload-alt text-2xl text-gray-500 mb-2"></i>
                                <p class="text-[10px] text-gray-400">Ảnh mặc định sẽ được sử dụng</p>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Trạng thái</label>
                            <div class="flex items-center gap-4 mt-2">
                                <label class="inline-flex items-center cursor-pointer">
                                    <input type="radio" name="status" value="published" checked class="text-cyan-600">
                                    <span class="ml-2 text-sm">Công khai</span>
                                </label>
                                <label class="inline-flex items-center cursor-pointer">
                                    <input type="radio" name="status" value="draft" class="text-cyan-600">
                                    <span class="ml-2 text-sm">Nháp</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <div class="p-4 border-t border-gray-700 flex justify-end gap-3 bg-gray-700/20">
                <button onclick="closePostModal()" class="px-6 py-2 rounded font-bold text-gray-400 hover:text-white transition">Hủy</button>
                <button onclick="savePost()" class="bg-cyan-600 hover:bg-cyan-500 px-8 py-2 rounded font-bold transition shadow-lg shadow-cyan-900/20">
                    Lưu & Xuất bản
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. QUẢN LÝ THỐNG KÊ
        function updatePostStats() {
            const rows = document.querySelectorAll('#post-table-body tr:not(#no-result-row)');
            let total = rows.length;
            let published = 0;
            let draft = 0;

            rows.forEach(row => {
                const statusText = row.querySelector('td:nth-child(4) span')?.innerText || "";
                if (statusText.includes('ĐÃ ĐĂNG')) published++;
                if (statusText.includes('BẢN NHÁP')) draft++;
            });

            document.getElementById('total-post-count').innerText = total;
            document.getElementById('published-post-count').innerText = published;
            document.getElementById('draft-post-count').innerText = draft;
        }

        // 2. MỞ/ĐÓNG MODAL
        function openPostModal(type) {
            const modal = document.getElementById('postModal');
            document.getElementById('modalPostTitle').innerText = type === 'edit' ? 'Chỉnh sửa bài viết' : 'Viết bài mới';
            if (type === 'add') document.getElementById('postForm').reset();
            modal.classList.remove('hidden');
        }

        function closePostModal() {
            document.getElementById('postModal').classList.add('hidden');
        }

        // 3. LƯU BÀI VIẾT (THÊM MỚI)
        function savePost() {
            const title = document.getElementById('modal-title').value;
            const category = document.getElementById('modal-category').value;
            const content = document.getElementById('modal-content').value;
            const statusVal = document.querySelector('input[name="status"]:checked').value;

            if (!title || !content) {
                Swal.fire({ title: 'Chú ý', text: 'Vui lòng nhập đầy đủ thông tin', icon: 'warning', background: '#1f2937', color: '#fff' });
                return;
            }

            const now = new Date();
            const dateStr = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
            
            const isPublished = statusVal === 'published';

            const newRow = document.createElement('tr');
            newRow.className = "hover:bg-gray-700/30 transition animate-fadeIn";
            newRow.innerHTML = `
                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=100" class="w-12 h-12 rounded object-cover border border-gray-600">
                        <div class="max-w-xs">
                            <p class="font-bold text-white line-clamp-2">${title}</p>
                            <p class="text-[10px] text-gray-500">Người viết: Admin</p>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4 ${category === 'Khuyến mãi' ? 'text-pink-400' : 'text-cyan-400'} font-medium">${category}</td>
                <td class="px-6 py-4 text-gray-400">${dateStr}</td>
                <td class="px-6 py-4">
                    <span class="${isPublished ? 'bg-green-900/40 text-green-400' : 'bg-yellow-900/40 text-yellow-400'} px-2 py-1 rounded-full text-[10px] font-bold">
                        ${isPublished ? 'ĐÃ ĐĂNG' : 'BẢN NHÁP'}
                    </span>
                </td>
                <td class="px-6 py-4 text-right space-x-3">
                    <button onclick="openPostModal('edit')" class="text-gray-400 hover:text-blue-400"><i class="fas fa-edit"></i></button>
                    <button onclick="deletePost(this)" class="text-gray-400 hover:text-red-400"><i class="fas fa-trash"></i></button>
                </td>
            `;

            document.getElementById('post-table-body').prepend(newRow);
            closePostModal();
            updatePostStats();
            
            Swal.fire({ title: 'Thành công!', text: 'Bài viết đã được thêm.', icon: 'success', background: '#1f2937', color: '#fff' });
        }

        // 4. XÓA BÀI VIẾT
        function deletePost(btn) {
            Swal.fire({
                title: 'Xóa bài viết này?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Đồng ý',
                cancelButtonText: 'Hủy',
                background: '#1f2937',
                color: '#fff'
            }).then((result) => {
                if (result.isConfirmed) {
                    btn.closest('tr').remove();
                    updatePostStats();
                    Swal.fire({ title: 'Đã xóa!', icon: 'success', background: '#1f2937', color: '#fff' });
                }
            });
        }

        // 5. BỘ LỌC TÌM KIẾM & DANH MỤC
        function filterPosts() {
            const searchTerm = document.getElementById('post-search').value.toLowerCase();
            const selectedCat = document.getElementById('filter-category').value.toLowerCase();
            const rows = document.querySelectorAll('#post-table-body tr:not(#no-result-row)');
            let visibleCount = 0;

            rows.forEach(row => {
                const title = row.querySelector('.font-bold').innerText.toLowerCase();
                const category = row.querySelector('td:nth-child(2)').innerText.toLowerCase();
                
                const matchesSearch = title.includes(searchTerm);
                const matchesCategory = selectedCat === "" || category.includes(selectedCat);

                if (matchesSearch && matchesCategory) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            // Hiển thị thông báo nếu không có kết quả
            let noResultRow = document.getElementById('no-result-row');
            if (visibleCount === 0) {
                if (!noResultRow) {
                    noResultRow = document.createElement('tr');
                    noResultRow.id = 'no-result-row';
                    noResultRow.innerHTML = `<td colspan="5" class="px-6 py-10 text-center text-gray-500">Không tìm thấy bài viết nào.</td>`;
                    document.getElementById('post-table-body').appendChild(noResultRow);
                }
            } else if (noResultRow) {
                noResultRow.remove();
            }
        }

        // Gắn sự kiện lắng nghe
        document.getElementById('post-search').addEventListener('input', filterPosts);
        document.getElementById('filter-category').addEventListener('change', filterPosts);

        // Khởi tạo số liệu khi trang load
        window.onload = updatePostStats;
    </script>
</body>
</html>
